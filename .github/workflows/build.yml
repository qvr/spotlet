name: Build

# Every push/PR builds the native core + APK and uploads the APK as an artifact.
# A push to main whose versionName (app/build.gradle.kts) has no release yet also
# creates a draft release "vX.Y.Z" with the APK attached. Publishing the draft
# creates the tag on the commit it was built from.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # draft release creation

# One run per ref at a time, so two quick merges can't both create a draft.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # A release (published or draft) or tag for this version means it has already been
      # released or is waiting to be published; later merges then leave it alone.
      - name: Check for a new version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          [ -n "$VERSION" ] || { echo "versionName not found"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          RELEASES=$(gh release list --limit 100 --json tagName --jq '.[].tagName')
          if grep -qx "v$VERSION" <<< "$RELEASES" \
              || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION already exists; no draft"
          else
            echo "v$VERSION is new; drafting a release"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # --platform 26 is required: cpal's AAudio backend links libaaudio.so, which the NDK
      # only ships for API >= 26 (also the app's minSdk).
      - name: Build native core
        working-directory: rust
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t armeabi-v7a -t arm64-v8a --platform 26 \
            -o ../app/src/main/jniLibs build --release
          # The core DT_NEEDEDs libc++_shared.so (see rust/build.rs); ship the NDK's copy.
          SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          cp "$SYSROOT/arm-linux-androideabi/libc++_shared.so" ../app/src/main/jniLibs/armeabi-v7a/
          cp "$SYSROOT/aarch64-linux-android/libc++_shared.so" ../app/src/main/jniLibs/arm64-v8a/
          ls -la ../app/src/main/jniLibs/*

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Release builds are signed with a persistent key so updates install over each other.
      # Without the secrets (e.g. on a fork) the release APK is simply left unsigned.
      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Stage APK
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release == 'true' && steps.version.outputs.version || '' }}
        run: |
          mkdir -p dist
          VERSION="${RELEASE_VERSION:-$(git rev-parse --short HEAD)}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "dist/spotlet-$VERSION.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: spotlet-apk
          path: dist/*.apk

      # Auto-generated notes are a starting point; edit the draft, then publish it.
      - name: Draft release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "dist/spotlet-$VERSION.apk" \
            --draft --target "$GITHUB_SHA" --title "Spotlet $VERSION" --generate-notes
